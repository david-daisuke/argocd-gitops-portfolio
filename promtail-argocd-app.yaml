apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-promtail
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    targetRevision: 6.15.3
    chart: promtail
    helm:
      values: |
        # Lokiへログを送信するための宛先設定
        config:
          clients:
            # monitoring名前空間にデプロイされた「loki」というServiceの3100番ポートへPushする
            - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
