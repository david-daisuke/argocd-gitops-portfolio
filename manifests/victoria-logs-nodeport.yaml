apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-nodeport
  namespace: logging
spec:
  type: NodePort
  selector:
    app: server
    app.kubernetes.io/instance: vls
    app.kubernetes.io/name: victoria-logs-single
  ports:
    - name: http
      protocol: TCP
      port: 9428
      targetPort: http
      nodePort: 30428
