apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-logs-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts/
    chart: victoria-logs-single
    targetRevision: 0.13.10
    helm:
      releaseName: vls
      values: |
        server:
          retentionPeriod: 7d
          persistentVolume:
            enabled: true
            storageClassName: local-path
            size: 10Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
