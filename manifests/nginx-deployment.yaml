# nginx-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-nginx-deployment
  labels:
    app: gitops-nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gitops-nginx
  template:
    metadata:
      labels:
        app: gitops-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
