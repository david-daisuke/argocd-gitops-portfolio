apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt-local
  namespace: k8sgpt-system
spec:
  ai:
    enabled: true
    backend: openai
    baseUrl: http://ollama.ollama.svc.cluster.local:11434/v1
    model: llama3
    secret:
      name: k8sgpt-openai-secret
      key: api-key
  filters:
    - Pod
    - Deployment
    - Service
  noCache: false
  repository: ghcr.io/k8sgpt-ai/k8sgpt
  version: v0.3.41
