apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
  namespace: argocd
spec:
  project: default
  source:
    repoURL: '[https://otwld.github.io/ollama-helm/](https://otwld.github.io/ollama-helm/)'
    targetRevision: 0.28.0
    chart: ollama
    helm:
      values: |
        ollama:
          models:
            - llama3
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 8Gi
  destination:
    server: '[https://kubernetes.default.svc](https://kubernetes.default.svc)'
    namespace: ollama
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
